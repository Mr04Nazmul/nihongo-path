name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: dist
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: pages-${{ github.run_id }}-${{ github.run_attempt }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          python3 - <<'PYTHON'
          import json, os, time, urllib.request, urllib.error
          url = (os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
                 + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts?per_page=100')
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json'})
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      artifacts = json.load(response)['artifacts']
                  matches = [a for a in artifacts if a['name'] == os.environ['PAGES_ARTIFACT_NAME']
                             and not a.get('expired', False)]
                  if len(matches) == 1 and str(matches[0]['id']) == os.environ['PAGES_ARTIFACT_ID']:
                      print('Uploaded Pages artifact metadata is available.')
                      break
              except urllib.error.HTTPError as error:
                  if error.code not in (429, 500, 502, 503, 504):
                      raise
              if attempt < 11:
                  time.sleep(5)
          else:
              raise SystemExit('Uploaded Pages artifact metadata is not available; safe to retry this job.')
          PYTHON
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
